apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: db
spec:
  ports:
  - port: 3306
  selector:
    component: mysql
    project: roboshop
    tier: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: db
spec:
  selector:
    matchLabels:
      component: mysql
      project: roboshop
      tier: db
  replicas: 1 # by default is 1
  template:
    metadata:
      labels:
        component: mysql
        project: roboshop
        tier: db
    spec:
      serviceAccountName: aws-secret-reader
      volumes:
      - name: mysql-secret
        emptyDir: {}
      containers:
      - name: mysql
        image: vidya07422/mysql:v2
        imagePullPolicy: Always
        args: ["--mysql-native-password=ON"]
        volumeMounts:
          - mountPath: /tmp
            name: mysql-secret
      initContainers:
      - name: init-myservice
        image: amazon/aws-cli
        command:
        - sh 
        - -c 
        - |
          aws secretsmanager get-secret-value --secret-id \
          roboshop/mysql/password --query SecretString \
          --output text | jq -r '.MYSQL_ROOT_PASSWORD' > /tmp/mysql_root_password.txt
          echo "Secret fetched successfully"
            
        volumeMounts:
          - mountPath: /tmp
            name: mysql-secret
        
        
